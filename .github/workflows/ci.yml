name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: skill frontmatter and file references
        run: python .github/validate_skill.py skills/i-hate-spaghetti
      - name: unit tests
        run: python -m unittest discover -s skills/i-hate-spaghetti/tests -v
      - name: self-scan
        run: python skills/i-hate-spaghetti/scripts/spaghetti.py sniff skills
      - name: score our own scripts
        run: python skills/i-hate-spaghetti/scripts/spaghetti.py score skills --max-func 60 || true
